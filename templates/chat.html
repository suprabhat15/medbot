<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedBot</title>
    <style>
        :root {
            --bg: #212121;
            --panel: #2f2f2f;
            --panel-2: #1e1e1e;
            --text: #ececec;
            --muted: #9b9b9b;
            --user-bubble: #2f2f2f;
            --bot-bubble: transparent;
            --accent: #10a37f;
            --border: #3f3f3f;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-2);
        }

        header .logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-inner {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 24px 20px 120px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .welcome {
            text-align: center;
            margin-top: 15vh;
            color: var(--muted);
        }

        .welcome h2 {
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .msg {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .msg.user .avatar { background: #5436da; }
        .msg.bot  .avatar { background: var(--accent); }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
        }

        .msg.user .bubble { background: var(--user-bubble); }
        .msg.bot  .bubble { background: var(--bot-bubble); padding-left: 0; }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        .composer {
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, rgba(33,33,33,0) 0%, var(--bg) 30%);
            padding: 16px 20px 20px;
        }

        .composer-inner {
            max-width: 780px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 8px 8px 8px 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
            padding: 8px 0;
        }

        .send-btn {
            background: var(--text);
            color: #000;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }

        .attach-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 4px;
            transition: color 0.15s, background 0.15s;
        }

        .attach-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .attach-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .upload-status {
            max-width: 780px;
            margin: 0 auto 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text);
            display: none;
        }

        .upload-status.show { display: block; }

        .upload-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .upload-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-pct { color: var(--muted); flex-shrink: 0; }

        .progress-track {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: var(--panel-2);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.2s ease;
        }

        .upload-status.indexing .progress-bar {
            width: 100% !important;
            animation: indeterminate 1.1s ease-in-out infinite;
        }

        .upload-status.error { border-color: #b04a4a; }
        .upload-status.error .progress-track { display: none; }
        .upload-status.done .progress-bar { background: var(--accent); }

        @keyframes indeterminate {
            0% { opacity: 0.45; }
            50% { opacity: 1; }
            100% { opacity: 0.45; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">M</div>
            <h1>MedBot</h1>
        </header>

        <div class="chat" id="chat">
            <div class="chat-inner" id="chatInner">
                <div class="welcome" id="welcome">
                    <h2>How can I help you today?</h2>
                    <p>Ask me anything about medical topics.</p>
                </div>
            </div>
        </div>

        <div class="composer">
            <div class="upload-status" id="uploadStatus">
                <div class="upload-row">
                    <span class="upload-name" id="uploadName"></span>
                    <span class="upload-pct" id="uploadPct"></span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
            <form class="composer-inner" id="form">
                <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
                <button type="button" class="attach-btn" id="attach" title="Upload a PDF">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <textarea
                    id="input"
                    rows="1"
                    placeholder="Message MedBot..."
                    autocomplete="off"
                ></textarea>
                <button type="submit" class="send-btn" id="send" disabled title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </form>
            <div class="footer-note">MedBot can make mistakes. Verify important information.</div>
        </div>
    </div>

    <script>
        const chatInner = document.getElementById('chatInner');
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const welcome = document.getElementById('welcome');

        function autoResize() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
            sendBtn.disabled = input.value.trim().length === 0;
        }

        input.addEventListener('input', autoResize);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        function appendMessage(role, text) {
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'M';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msg.appendChild(avatar);
            msg.appendChild(bubble);
            chatInner.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        function appendTyping() {
            const msg = document.createElement('div');
            msg.className = 'msg bot';
            msg.id = 'typingMsg';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'M';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

            msg.appendChild(avatar);
            msg.appendChild(bubble);
            chatInner.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typingMsg');
            if (t) t.remove();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            if (welcome) welcome.remove();

            appendMessage('user', text);
            input.value = '';
            autoResize();
            sendBtn.disabled = true;
            input.disabled = true;

            appendTyping();

            try {
                const formData = new FormData();
                formData.append('msg', text);

                const res = await fetch('/get', {
                    method: 'POST',
                    body: formData
                });

                const answer = await res.text();
                removeTyping();
                appendMessage('bot', answer);
            } catch (err) {
                removeTyping();
                appendMessage('bot', 'Sorry, something went wrong. Please try again.');
            } finally {
                input.disabled = false;
                input.focus();
            }
        });

        async function loadHistory() {
            try {
                const res = await fetch('/history');
                const messages = await res.json();
                if (messages.length > 0 && welcome) welcome.remove();
                for (const m of messages) {
                    appendMessage(m.role, m.text);
                }
            } catch (err) {
                // No history available; start fresh.
            }
        }

        // ---- PDF upload with progress bar ----
        const attachBtn = document.getElementById('attach');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const uploadName = document.getElementById('uploadName');
        const uploadPct = document.getElementById('uploadPct');
        const progressBar = document.getElementById('progressBar');

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) uploadFile(file);
            fileInput.value = '';
        });

        function showStatus(name, cls) {
            uploadStatus.className = 'upload-status show' + (cls ? ' ' + cls : '');
            uploadName.textContent = name;
        }

        function uploadFile(file) {
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                showStatus('Only PDF files are supported.', 'error');
                uploadPct.textContent = '';
                return;
            }

            attachBtn.disabled = true;
            showStatus(file.name, '');
            uploadPct.textContent = '0%';
            progressBar.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');

            // Network transfer progress (0–100% of the upload).
            xhr.upload.addEventListener('progress', (e) => {
                if (!e.lengthComputable) return;
                const pct = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = pct + '%';
                uploadPct.textContent = pct + '%';
            });

            // Transfer finished — server is now embedding + indexing.
            xhr.upload.addEventListener('load', () => {
                uploadStatus.classList.add('indexing');
                uploadPct.textContent = 'Indexing…';
            });

            xhr.addEventListener('load', () => {
                uploadStatus.classList.remove('indexing');
                attachBtn.disabled = false;

                let data = {};
                try { data = JSON.parse(xhr.responseText); } catch (_) {}

                if (xhr.status >= 200 && xhr.status < 300 && data.status === 'ok') {
                    progressBar.style.width = '100%';
                    uploadPct.textContent = 'Ready';
                    showStatus('✓ ' + data.filename + ' — ask me about it', 'done');
                    if (welcome) welcome.remove();
                    appendMessage('bot', `I've read "${data.filename}". Ask me anything about it.`);
                } else {
                    progressBar.style.width = '0%';
                    uploadPct.textContent = '';
                    showStatus(data.error || 'Upload failed. Please try again.', 'error');
                }
            });

            xhr.addEventListener('error', () => {
                uploadStatus.classList.remove('indexing');
                attachBtn.disabled = false;
                progressBar.style.width = '0%';
                uploadPct.textContent = '';
                showStatus('Upload failed. Please try again.', 'error');
            });

            const formData = new FormData();
            formData.append('file', file);
            xhr.send(formData);
        }

        loadHistory();
        input.focus();
    </script>
</body>
</html>
