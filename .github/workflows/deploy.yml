name: Deploy to AWS EC2 via ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build image & push to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch ECR login password
        id: ecr-password
        run: |
          echo "::add-mask::$(aws ecr get-login-password --region "${{ secrets.AWS_REGION }}")"
          echo "password=$(aws ecr get-login-password --region "${{ secrets.AWS_REGION }}")" >> "$GITHUB_OUTPUT"

      - name: Deploy container over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,ECR_PASSWORD,PINECONE_API_KEY,OPENAI_API_KEY,FLASK_SECRET_KEY
          script: |
            set -e

            # Authenticate the Docker daemon on the EC2 host to ECR.
            # The login token is fetched on the runner, so the AWS CLI is
            # not required on the EC2 host.
            REGISTRY=$(echo "$IMAGE" | cut -d'/' -f1)
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$REGISTRY"

            # Pull the freshly built image
            docker pull "$IMAGE"

            # Replace the running container
            docker stop medbot || true
            docker rm medbot || true
            docker run -d \
              --name medbot \
              --restart unless-stopped \
              -p 80:8080 \
              -e PORT=8080 \
              -e PINECONE_API_KEY="$PINECONE_API_KEY" \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e FLASK_SECRET_KEY="$FLASK_SECRET_KEY" \
              "$IMAGE"

            # Reclaim disk from old images
            docker image prune -f
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
